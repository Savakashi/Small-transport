# Layer 7 Upstream Cluster for Backend Containers
upstream backend_cluster {
    # Routes incoming requests to the replica with the fewest active connections
    least_conn;

    # Internal Docker DNS automatically resolves 'backend' to all running container replicas
    server backend:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 1. Reverse Proxy & Load Balancer for API Traffic
    location /api/ {
        proxy_pass http://backend_cluster;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 Persistent Connections & WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Failover and timeout limits
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Telemetry header confirming load-balanced path
        add_header X-Load-Balanced "True" always;
    }

    # 2. Health Check Probe
    location /healthz {
        proxy_pass http://backend_cluster/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # 3. Frontend Static Fallback / SPA Catch-All
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
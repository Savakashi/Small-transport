services:
  db:
    image: postgres:16-alpine
    container_name: transport_db
    restart: unless-stopped
    environment:  
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cloud
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - transport_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transport_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:root@transport_db:5432/cloud
    depends_on:
      - db
    expose:
      - "8080"
    networks:
      - transport_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transport_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - transport_net

volumes:
  pgdata:

networks:
  transport_net:
    driver: bridge